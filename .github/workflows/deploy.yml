name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the official Pages deploy actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment run at a time per environment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Build
        run: npm run build

      - name: Verify build output
        # Fail fast in CI if any critical artifact is missing — much better
        # than discovering a broken deployment after it's live.
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          test -f dist/submit-manuscript/index.html
          test -f dist/collaboration/index.html
          test -f dist/contact/index.html
          test ! -d dist/books
          echo "✓ All critical build artifacts present"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
